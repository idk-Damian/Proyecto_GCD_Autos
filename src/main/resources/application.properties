spring.datasource.url=jdbc:mysql://localhost:3307/proyecto_soa?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
server.port=8080
spring.thymeleaf.cache=false
server.error.include-message=always


# Mostrar el cuadro de credenciales de demostración en el login (false en producción)
app.demo.mostrar-credenciales=true

# Datos del taller (encabezado de comprobantes y reportes)
app.taller.nombre=Taller Mec\u00e1nico
app.taller.ruc=
app.taller.direccion=Ambato, Ecuador
app.taller.telefono=

# Recordatorios de mantenimiento preventivo
app.mantenimiento.intervalo-km=5000
app.mantenimiento.intervalo-meses=6
app.mantenimiento.aviso-km=1000
app.mantenimiento.aviso-dias=30
